name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test and build dependencies
        run: python -m pip install --upgrade pip build pytest
      - name: Compile package and tests
        run: python -m compileall -q devguard tests
      - name: Run tests
        run: python -m pytest -q
      - name: Build source distribution and wheel
        run: python -m build
      - name: Install built wheel
        run: python -m pip install --force-reinstall dist/*.whl
      - name: Installed CLI smoke tests
        run: |
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          printf 'print("hello")\n' > "$tmpdir/clean.py"
          cd "$tmpdir"
          devguard --help
          devguard scan clean.py --quiet
          devguard scan clean.py --format json | python -c 'import json, sys; assert json.load(sys.stdin)["count"] == 0'
